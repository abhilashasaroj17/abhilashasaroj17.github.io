---
layout: blog
---
<section class="main"><div class="wrap"><article class="post-shell">
  <div class="post-heading">
    <a class="back" href="/blog/">← All posts</a>
    <p class="meta"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%B %-d, %Y' }}</time>{% if page.category %} · {{ page.category | escape }}{% endif %}</p>
    <h1>{{ page.title | escape }}</h1>
    {% if page.description %}<p>{{ page.description | escape }}</p>{% endif %}
  </div>
  <div class="article">{{ content }}</div>
  <a class="back" href="/blog/">← Back to Blog</a>
</article></div></section>
